<script>
window.SAIL_DATA_PREFIX = "../data/";
window.SAIL_T = {
  pickLine: "1 · 選擇郵輪公司",
  pickShip: "2 · 選擇船隻",
  shipCapacity: "位乘客",
  comingSoon: "這艘船的即時行程即將上線——敬請期待。",
  nights: "晚",
  departs: "出發",

  wxFail: "目前無法取得天氣。",
  planPort: "規劃這個停靠日",

  noSailings: "這艘船尚無行程資料。",
  plannerUrl: "../ports.html"
};

<script src="../sailings.js"></script>
<script>
(function(){
  var F = window.SailFinder, T = F.getT();
  var lineSel = document.getElementById("line-sel"),
      shipSel = document.getElementById("ship-sel"),
      results = document.getElementById("results");
  F.bindToggle(document);

  function render(lineSlug, shipId){
    results.innerHTML = "";
    if (!lineSlug || !shipId) return;
    var ship = F.findShip(lineSlug, shipId);
    if (!ship) return;
    var sailings = F.sailingsFor(lineSlug, shipId);
    var head = '<div class="ship-note"><h3>' + ship.name + "</h3><p class=\"sail-meta\">" +
      F.LINE_NAMES[lineSlug] + (ship.passengers ? " · " + ship.passengers.toLocaleString("en-US") + " " + T.shipCapacity : "") + "</p></div>";
    if (!sailings.length){
      results.innerHTML = head + '<div class="ship-note"><p>' + T.comingSoon + "</p></div>";
      return;
    }
    results.innerHTML = head + sailings.map(function(s, i){ return F.sailingCard(s, i); }).join("");
  }

  F.loadData().then(function(){
    F.lineOptions(lineSel);
    lineSel.onchange = function(){
      F.shipOptions(shipSel, lineSel.value);
      render(lineSel.value, "");
    };
    shipSel.onchange = function(){ render(lineSel.value, shipSel.value); };
    var q = new URLSearchParams(location.search);
    if (q.get("line") && F.LINE_NAMES[q.get("line")]){
      lineSel.value = q.get("line");
      F.shipOptions(shipSel, lineSel.value);
      if (q.get("ship")){ shipSel.value = q.get("ship"); render(lineSel.value, shipSel.value); }
    }
  }).catch(function(){
    results.innerHTML = "<p>行程資料載入失敗——請再試一次。</p>";
  });
})();
</script>
